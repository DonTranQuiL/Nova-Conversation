generate_image:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: nova_conversation
    prompt:
      required: true
      selector:
        text:
          multiline: true
    size:
      required: false
      example: "1024x1024"
      default: "1024x1024"
      selector:
        select:
          options:
            - "1024x1024"
            - "1024x1792"
            - "1792x1024"
    quality:
      required: false
      example: "standard"
      default: "standard"
      selector:
        select:
          options:
            - "standard"
            - "hd"
    style:
      required: false
      example: "vivid"
      default: "vivid"
      selector:
        select:
          options:

analyze_camera:
  name: "Nova: Analyze Camera"
  description: "Takes a snapshot from a camera and asks the Nova AI to describe it."
  fields:
    config_entry:
      name: "Config Entry"
      description: "Select the Nova instance to use."
      required: true
      selector:
        config_entry:
          integration: nova_conversation
    camera_entity:
      name: "Camera"
      description: "The camera to look at."
      required: true
      selector:
        entity:
          domain: camera
    prompt:
      name: "Prompt"
      description: "What do you want Nova to look for? (e.g., 'Is there a package on the porch?')"
      required: false
      selector:
        text:
          multiline: true
            - "vivid"
            - "natural"
