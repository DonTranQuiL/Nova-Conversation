name: Home Assistant CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component pytest-cov respx hassil

      - name: Run tests
        run: |
          pytest -v tests/ --cov=custom_components/nova_conversation/ --cov-report=xml
