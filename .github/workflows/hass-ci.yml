name: Home Assistant CI

on:
  push:
    branches: [ main ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_test.txt"
      - ".github/workflows/hass-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "custom_components/**"
      - "tests/**"
      - "requirements_test.txt"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi
          pip install pytest pytest-asyncio pytest-homeassistant-custom-component pytest-cov respx
          pip install mutagen ha-ffmpeg pymicro-vad webrtc-noise-gain pyspeex-noise
          # Install the hassil/intents versions pinned by HA's conversation component (latest hassil lacks hassil.fuzzy)
          python -c "import os, json, homeassistant; print('\n'.join(json.load(open(os.path.join(os.path.dirname(homeassistant.__file__), 'components/conversation/manifest.json'))).get('requirements', [])))" | xargs -r pip install

      - name: Run tests
        run: |
          pytest -v tests/ --cov=custom_components/nova_conversation/ --cov-report=xml
