name: Python Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          
          # 1. Install core testing tools (Removed floating hassil/intents here!)
          pip install pytest pytest-cov pytest-asyncio pytest-homeassistant-custom-component mutagen ha-ffmpeg pymicro-vad pyspeex-noise
          
          # 2. MAGIC TRICK #2: Extract and enforce Home Assistant's internal conversation requirements!
          python -c "import os, json, homeassistant; print('\n'.join(json.load(open(os.path.join(os.path.dirname(homeassistant.__file__), 'components/conversation/manifest.json'))).get('requirements', [])))" | xargs -r pip install

          # 3. MAGIC TRICK #1: Find your custom manifest.json and install its requirements automatically!
          if ls custom_components/*/manifest.json 1> /dev/null 2>&1; then
            jq -r '.requirements[]?' custom_components/*/manifest.json | xargs -r pip install
          fi
          
          # 4. Also install requirements.txt if you ever use one
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Pytest and generate coverage
        run: |
          pytest tests/ -v --cov=custom_components/ --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false